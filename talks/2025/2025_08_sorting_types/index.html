<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sorting types</title>

    <link rel="stylesheet" href="../../../dist/reset.css">
    <link rel="stylesheet" href="../../../dist/reveal.css">
    <link rel="stylesheet" href="../../../dist/theme/black.css">

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="../../../plugin/highlight/monokai.css">

    <style>
        /* Tweak text size (optional) */
        .reveal pre code {
            font-size: clamp(12px, 1.4vw, 20px);
            line-height: 1.25;
        }

        /* HEIGHT: give code blocks more vertical space + scrolling */
        .reveal pre.tall {
            height: 70vh;
            /* pick your number (e.g., 50vh, 80vh) */
            max-height: 70vh;
            /* keep it capped */
            overflow: auto;
            /* scroll if content is long */
        }

        /* WIDTH OPTION A: keep within normal content width but wider than default */
        .reveal pre {
            width: 100%;
            /* e.g., 90–100% of the content area */
            margin-left: auto;
            margin-right: auto;
        }

        /* WIDTH OPTION B: full-bleed edge-to-edge across the slide */
        .reveal pre.full-bleed {
            /* extend beyond Reveal’s side margins */
            width: 120%;
            margin-left: auto;
            margin-right: auto;
        }

        /* WIDTH OPTION C: fixed character width (independent of slide width) */
        .reveal pre.narrow {
            max-width: none;
            /* allow wider than container */
            width: 90ch;
            /* ~90 characters wide */
            overflow-x: auto;
            /* horizontal scroll if needed */
            margin-left: auto;
            margin-right: auto;
        }
    </style>


</head>

<body>



    <div class="reveal">
        <div class="reveal">
            <div class="slides">
                <include src="introduction.html"></include>

                <section>
                    <h2>C++ Refresher</h2>
                </section>
                <section data-markdown="const_explanations.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-charset="iso-8859-15" data-transition="slide">
                </section>

                <section data-markdown="decltype_declval.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-charset="iso-8859-15" data-transition="slide">
                </section>

                <include src="unit_definition.html"></include>

                <include src="old_way.html"></include>

                <section data-markdown="new_way.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-transition="slide">
                </section>

                <section data-markdown="post.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-charset="iso-8859-15" data-transition="slide">
                </section>
            </div>
        </div>
    </div>

    <script src="../../../dist/reveal.js"></script>
    <script src="../../../plugin/notes/notes.js"></script>
    <script src="../../../plugin/markdown/markdown.js"></script>
    <script src="../../../plugin/highlight/highlight.js"></script>
    <script src="../../../plugin/math/math.js"></script>
    <script>

        function loadIncludes() {
            return Promise.all(
                [...document.querySelectorAll("include")].map((include) => {
                    return fetch(include.getAttribute("src"))
                        .then((response) => response.text())
                        .then((html) => (include.outerHTML = html))
                        .catch(console.err);
                })
            );
        }
        loadIncludes().then(() => {

            Reveal.initialize({
                hash: true,
                slideNumber: 'c/t',
                plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX]
            });
        });
    </script>
</body>

</html>
