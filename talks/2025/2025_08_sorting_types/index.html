<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sorting types</title>

    <link rel="stylesheet" href="/dist/reset.css">
    <link rel="stylesheet" href="/dist/reveal.css">
    <link rel="stylesheet" href="/dist/theme/black.css">

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="/plugin/highlight/monokai.css">
</head>

<body>
    <div class="reveal">
        <div class="reveal">
            <div class="slides">
                <section data-markdown="introduction.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-charset="iso-8859-15" data-transition="slide">
                </section>

                <section data-markdown="const_explanations.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-charset="iso-8859-15" data-transition="slide">
                </section>

                <section data-markdown="post.md" data-separator="^^\r?\n---\r?\n$"
                    data-separator-vertical="^\r?\n------\r?\n$" data-separator-notes="^Note:"
                    data-charset="iso-8859-15" data-transition="slide">
                </section>
            </div>
        </div>
    </div>

    <script src="/dist/reveal.js"></script>
    <script src="/plugin/notes/notes.js"></script>
    <script src="/plugin/markdown/markdown.js"></script>
    <script src="/plugin/highlight/highlight.js"></script>
    <script>
        Reveal.initialize({
            hash: true,

            plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
        });
    </script>
</body>

</html>
